<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="styles.css" rel="stylesheet">
    <title>Home - Sobre Vidas</title>
</head>
<body>
    <div class="caixa">
        <div class="titulo-principal">Home</div>
        <br />
        <div class="container-cadastro" id="listaPessoas">
            <!-- Os cards serão adicionados dinamicamente aqui -->
        </div>
    </div>

<script>
    // Lista de pessoas fixas
    const pessoasFixas = [
        {
            nome: "Charles Haddon Spurgeon",
            historia: "Spurgeon nasceu em 1834, em Kelvedon, na Inglaterra. Desde jovem mostrou grande interesse pela Bíblia e pela pregação cristã. Com apenas 19 anos, tornou-se pastor da New Park Street Chapel, em Londres (que depois se tornaria o famoso Metropolitan Tabernacle). Sua eloquência, profundidade teológica e paixão pelo evangelho fizeram com que milhares de pessoas o ouvissem semanalmente — em uma época sem microfones! 'A Bíblia não é a luz do mundo, mas a luz do mundo não pode brilhar sem a Bíblia.'",
            foto: "https://m.media-amazon.com/images/I/619rC422a0L._AC_UF894,1000_QL80_.jpg"
        },
        {
            nome: "Hernandes Dias Lopes",
            historia: "Hernandes Dias Lopes é pastor, teólogo, autor de mais de 150 livros e conferencista de ampla repercussão no Brasil. Sua atuação dialoga com questões teológicas, culturais e sociais, e sua voz emerge como referência dentro da tradição reformada brasileira.",
            foto:"https://www.hinologia.org/wp-content/uploads/2022/11/Hernandes-Dias-Lopes.jpg"
        }
    ];

    // Recupera os cadastros do localStorage
    let cadastros = [];
    try {
        cadastros = JSON.parse(localStorage.getItem("listaPessoas")) || [];
        // Garante que seja um array
        if (!Array.isArray(cadastros)) cadastros = [];
    } catch(e) {
        cadastros = [];
    }

    // Junta as pessoas fixas com os cadastros do localStorage
    const todasPessoas = pessoasFixas.concat(cadastros);

    // Referência ao container
    const listaPessoas = document.getElementById("listaPessoas");

    // Função para criar card de pessoa
    function criarCard(pessoa) {
        return `
        <div class="card-pessoa mb-4" style="flex: 0 0 48%;">
            <div class="topo-card">
                <img src="${pessoa.foto}" alt="${pessoa.nome}" class="foto-pessoa" style="width:80px;height:80px;object-fit:cover;">
                <div>
                    <p class="nome-pessoa">${pessoa.nome}</p>
                </div>
            </div>
            <div class="historia-pessoa">${pessoa.historia}</div>
        </div>`;
    }

    // Renderiza todas as pessoas
    if(todasPessoas.length > 0){
        todasPessoas.forEach(pessoa => {
            listaPessoas.innerHTML += criarCard(pessoa);
        });
    } else {
        listaPessoas.innerHTML = "<p>Nenhuma pessoa cadastrada.</p>";
    }
</script>


</body>
</html>
