<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página em Construção</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6c63ff, #3f3d56);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container {
      max-width: 500px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2rem;
    }
    .emoji {
      font-size: 4rem;
      margin-bottom: 20px;
    }
    .btn-home {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🚧</div>
    <h1>Página em Construção</h1>
    <p>Estamos trabalhando para trazer conteúdo incrível em breve!</p>
    <a href="index.html" class="btn btn-light btn-home">Voltar para a Home</a>
  </div>
</body>
</html>
