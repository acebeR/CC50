<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro com Pré-visualização</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="caixa">
        <div class="container-cadastro">
        <!-- LADO ESQUERDO: FORMULÁRIO -->
        <div class="form-container">
            <h2 class="titulo-principal">Cadastro de História</h2>

            <form class="form-cadastro" onsubmit="return false">
            <div class="form-group">
                <label for="foto">Foto:</label>
                <input
                type="file"
                id="foto"
                accept="image/*"
                class="form-control"
                onchange="previewImage(event)"
                />
            </div>

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input
                type="text"
                id="nome"
                class="form-control"
                placeholder="Digite o nome"
                oninput="atualizarNome()"
                />
            </div>

            <div class="form-group">
                <label for="historia">Sua História:</label>
                <textarea
                id="historia"
                class="form-control"
                rows="6"
                placeholder="Conte sua história..."
                oninput="atualizarHistoria()"
                ></textarea>
            </div>

            <button type="submit" class="btn-enviar"  onclick="salvarCadastroNoCache()">Salvar</button>
            </form>
        </div>

        <!-- LADO DIREITO: PRÉ-VISUALIZAÇÃO -->
        <div class="preview-card">
            <h3 class="subtitulo">Pré-visualização</h3>
            <div class="card-pessoa">
            <div class="topo-card">
                <img id="previewFoto" src="img/placeholder.jpg" alt="Foto" class="foto-pessoa" />
                <div class="info-pessoa">
                <h3 id="previewNome" class="nome-pessoa">Nome da Pessoa</h3>
                </div>
            </div>
            <div class="historia-pessoa">
                <p id="previewHistoria">
                A história aparecerá aqui conforme você digitar...
                </p>
            </div>
            </div>
        </div>
      </div>
    </div>

 <script>
  // Atualiza imagem da pré-visualização
  function previewImage(event) {
    const file = event.target.files[0];
    const preview = document.getElementById("previewFoto");
    if (file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      preview.src = "img/placeholder.jpg";
    }
  }

  // Atualiza nome na pré-visualização
  function atualizarNome() {
    const nome = document.getElementById("nome").value;
    document.getElementById("previewNome").textContent = nome || "Nome da Pessoa";
  }

  // Atualiza história na pré-visualização
  function atualizarHistoria() {
    const historia = document.getElementById("historia").value;
    document.getElementById("previewHistoria").textContent =
      historia || "A história aparecerá aqui conforme você digitar...";
  }

  // Função principal para salvar cadastro
  function salvarCadastroNoCache() {
    const nome = document.getElementById("nome").value.trim();
    const historia = document.getElementById("historia").value.trim();
    const fileInput = document.getElementById("foto");
    const file = fileInput.files[0];

    if (!nome || !historia) {
      alert("Por favor, preencha o nome e a história antes de salvar.");
      return;
    }

    if (file) {
      resizeImage(file, 200, function(resizedBase64) { // Redimensiona para largura 200px
        salvarNoLocalStorage(nome, historia, resizedBase64);
      });
    } else {
      // Se não houver imagem, usa null ou placeholder
      salvarNoLocalStorage(nome, historia, null);
    }
  }

  // Função auxiliar para salvar no localStorage
  function salvarNoLocalStorage(nome, historia, fotoBase64) {
    let cadastros = JSON.parse(localStorage.getItem("listaPessoas")) || [];
    cadastros.push({ nome, historia, foto: fotoBase64 });
    localStorage.setItem("listaPessoas", JSON.stringify(cadastros));
    alert("Cadastro salvo no cache do navegador!");

    // Limpa formulário e pré-visualização
    document.getElementById("nome").value = "";
    document.getElementById("historia").value = "";
    document.getElementById("foto").value = "";
    document.getElementById("previewNome").textContent = "Nome da Pessoa";
    document.getElementById("previewHistoria").textContent = "A história aparecerá aqui conforme você digitar...";
    document.getElementById("previewFoto").src = "img/placeholder.jpg";
  }

  // Função para redimensionar imagem antes de salvar
  function resizeImage(file, maxWidth, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const scale = maxWidth / img.width;
        canvas.width = maxWidth;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL('image/jpeg', 0.7)); // formato JPEG e compressão
      }
      img.src = e.target.result;
    }
    reader.readAsDataURL(file);
  }
</script>
  </body>
</html>
